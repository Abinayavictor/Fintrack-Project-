<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with premium finish -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Subtle circular recurring rhythm halo -->
  <circle cx="32" cy="32" r="22" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Shield Base Contour for Security & Reliability -->
  <path d="M32 14 L46 20 C46 32 39 42 32 47 C25 42 18 32 18 20 Z" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Ascending Financial Growth Bars -->
  <rect x="23" y="31" width="4.5" height="9" rx="2" fill="#38bdf8" opacity="0.85" />
  <rect x="30" y="25" width="4.5" height="15" rx="2" fill="#38bdf8" />
  <rect x="37" y="20" width="4.5" height="20" rx="2" fill="url(#glowGrad)" />

  <!-- Dynamic Upward Chevron Arrow -->
  <path d="M22 34 L31 25 L37 31 L44 20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  <path d="M38 20 H44 V26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Emerald Intelligence Node -->
  <circle cx="44" cy="20" r="2.2" fill="#10b981" />
</svg>